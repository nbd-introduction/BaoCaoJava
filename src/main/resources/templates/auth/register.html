<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - CoffeeShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#4E342E; --accent:#D4A574; --accent-light:#F5E6D3; --bg:#FFF8F0; --text:#3E2723; --text-light:#8D6E63; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Lato',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; }

        .navbar { background:var(--primary); padding:0 5%; height:65px; display:flex; align-items:center; justify-content:space-between; }
        .nav-logo { font-family:'Playfair Display',serif; color:var(--accent); font-size:22px; font-weight:700; text-decoration:none; }
        .nav-logo span { color:white; }
        .nav-right a { color:rgba(255,255,255,0.8); text-decoration:none; font-size:14px; }
        .nav-right a:hover { color:var(--accent); }

        .page-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }

        .register-box { background:white; border-radius:20px; box-shadow:0 8px 40px rgba(78,52,46,0.15); overflow:hidden; width:100%; max-width:480px; }
        .register-header { background:linear-gradient(135deg, var(--primary), #795548); padding:36px 40px; text-align:center; }
        .register-header .logo { font-size:40px; margin-bottom:10px; }
        .register-header h1 { font-family:'Playfair Display',serif; color:white; font-size:26px; margin-bottom:6px; }
        .register-header p { color:rgba(255,255,255,0.75); font-size:14px; }

        .register-body { padding:36px 40px; }

        .alert-error { background:#fdecea; border-left:4px solid #ef5350; color:#c62828; padding:12px 16px; border-radius:8px; font-size:14px; margin-bottom:20px; display:flex; align-items:center; gap:8px; }
        .alert-success { background:#e8f5e9; border-left:4px solid #66bb6a; color:#2e7d32; padding:12px 16px; border-radius:8px; font-size:14px; margin-bottom:20px; display:flex; align-items:center; gap:8px; }

        .form-group { margin-bottom:18px; }
        .form-group label { display:block; margin-bottom:6px; font-size:13px; font-weight:600; color:var(--text); }
        .form-group .input-wrap { position:relative; }
        .form-group .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:16px; }
        .form-group input { width:100%; padding:12px 14px 12px 42px; border:1.5px solid #e0d5cc; border-radius:10px; font-size:14px; outline:none; font-family:'Lato',sans-serif; color:var(--text); transition:border-color 0.2s; }
        .form-group input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(78,52,46,0.08); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

        .terms { display:flex; align-items:flex-start; gap:10px; margin-bottom:22px; font-size:13px; color:var(--text-light); }
        .terms input[type=checkbox] { margin-top:2px; accent-color:var(--primary); flex-shrink:0; }
        .terms a { color:var(--primary); text-decoration:none; font-weight:600; }

        .btn-register { width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; font-family:'Lato',sans-serif; transition:all 0.3s; }
        .btn-register:hover { background:#795548; transform:translateY(-1px); box-shadow:0 4px 15px rgba(78,52,46,0.3); }

        .divider { text-align:center; margin:20px 0; color:var(--text-light); font-size:13px; position:relative; }
        .divider::before { content:''; position:absolute; left:0; top:50%; width:40%; height:1px; background:#e0d5cc; }
        .divider::after { content:''; position:absolute; right:0; top:50%; width:40%; height:1px; background:#e0d5cc; }

        .login-link { text-align:center; font-size:14px; color:var(--text-light); }
        .login-link a { color:var(--primary); font-weight:700; text-decoration:none; }
        .login-link a:hover { text-decoration:underline; }

        .strength-bar { height:4px; border-radius:4px; margin-top:6px; background:#f0e8e0; overflow:hidden; }
        .strength-fill { height:100%; border-radius:4px; transition:all 0.3s; width:0; }
        .strength-text { font-size:11px; margin-top:4px; }

        footer { background:#2C1810; color:rgba(255,255,255,0.5); padding:16px 5%; text-align:center; font-size:12px; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="nav-logo">☕ Coffee<span>Shop</span></a>
    <div class="nav-right">
        <a href="/auth/login">Đã có tài khoản? Đăng nhập</a>
    </div>
</nav>

<div class="page-wrap">
    <div class="register-box">
        <div class="register-header">
            <div class="logo">☕</div>
            <h1>Tạo tài khoản mới</h1>
            <p>Tham gia CoffeeShop và tích điểm ngay hôm nay!</p>
        </div>
        <div class="register-body">

            <!-- LỖI -->
            <div th:if="${error}" class="alert-error">
                ⚠️ <span th:text="${error}">Có lỗi xảy ra</span>
            </div>

            <!-- THÀNH CÔNG -->
            <div th:if="${success}" class="alert-success">
                ✅ Đăng ký thành công! <a href="/auth/login" style="color:#2e7d32;font-weight:700">Đăng nhập ngay →</a>
            </div>

            <form th:action="@{/auth/register}" method="post" id="registerForm" th:unless="${success}">

                <div class="form-row">
                    <div class="form-group">
                        <label>Họ và tên *</label>
                        <div class="input-wrap">
                            <span class="input-icon">👤</span>
                            <input type="text" name="name" placeholder="Nguyễn Văn A"
                                   th:value="${formData?.name}" required/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <div class="input-wrap">
                            <span class="input-icon">📞</span>
                            <input type="tel" name="phone" placeholder="0901 234 567"
                                   th:value="${formData?.phone}"/>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <div class="input-wrap">
                        <span class="input-icon">📧</span>
                        <input type="email" name="email" placeholder="email@example.com"
                               th:value="${formData?.email}" required/>
                    </div>
                </div>

                <div class="form-group">
                    <label>Mật khẩu *</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" name="password" id="password"
                               placeholder="Tối thiểu 6 ký tự" required
                               oninput="checkStrength(this.value)"/>
                    </div>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                </div>

                <div class="form-group">
                    <label>Xác nhận mật khẩu *</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" name="confirmPassword" id="confirmPassword"
                               placeholder="Nhập lại mật khẩu" required
                               oninput="checkConfirm()"/>
                    </div>
                    <div id="confirmMsg" style="font-size:12px;margin-top:4px"></div>
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms" required/>
                    <label for="terms">
                        Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a> và
                        <a href="#">Chính sách bảo mật</a> của CoffeeShop
                    </label>
                </div>

                <button type="submit" class="btn-register">🚀 Đăng ký ngay</button>
            </form>

            <div class="divider">hoặc</div>
            <div class="login-link">
                Đã có tài khoản? <a href="/auth/login">Đăng nhập ngay</a>
            </div>
        </div>
    </div>
</div>

<footer>© 2026 CoffeeShop. ☕ Hương vị đậm đà, khoảnh khắc khó quên.</footer>

<script>
    function checkStrength(password) {
        const fill = document.getElementById('strengthFill');
        const text = document.getElementById('strengthText');
        if (password.length === 0) { fill.style.width = '0'; text.textContent = ''; return; }
        let strength = 0;
        if (password.length >= 6) strength++;
        if (password.length >= 10) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;

        const levels = [
            { w: '20%', c: '#ef5350', t: '😟 Rất yếu' },
            { w: '40%', c: '#ff9800', t: '😐 Yếu' },
            { w: '60%', c: '#ffeb3b', t: '🙂 Trung bình' },
            { w: '80%', c: '#8bc34a', t: '😊 Mạnh' },
            { w: '100%', c: '#4caf50', t: '💪 Rất mạnh' },
        ];
        const lvl = levels[Math.min(strength - 1, 4)] || levels[0];
        fill.style.width = lvl.w;
        fill.style.background = lvl.c;
        text.textContent = lvl.t;
        text.style.color = lvl.c;
    }

    function checkConfirm() {
        const pw = document.getElementById('password').value;
        const cpw = document.getElementById('confirmPassword').value;
        const msg = document.getElementById('confirmMsg');
        if (cpw.length === 0) { msg.textContent = ''; return; }
        if (pw === cpw) {
            msg.textContent = '✅ Mật khẩu khớp';
            msg.style.color = '#2e7d32';
        } else {
            msg.textContent = '❌ Mật khẩu không khớp';
            msg.style.color = '#c62828';
        }
    }

    document.getElementById('registerForm')?.addEventListener('submit', function(e) {
        const pw = document.getElementById('password').value;
        const cpw = document.getElementById('confirmPassword').value;
        if (pw !== cpw) {
            e.preventDefault();
            alert('Mật khẩu không khớp!');
        }
    });
</script>
</body>
</html>
