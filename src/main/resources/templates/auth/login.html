<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop - Đăng nhập</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #efebe9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 40px 35px;
      border-radius: 20px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.1);
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-icon {
      width: 90px;
      height: 90px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.1);
      font-size: 48px;
    }

    .logo h1 {
      color: #5D4037;
      font-size: 26px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #555;
      font-size: 14px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #5D4037;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: white;
      transition: border-color 0.2s;
      color: #333;
    }

    .form-group input:focus {
      border-color: #5D4037;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: #5D4037;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }

    .btn-login:hover { background: #4e342e; }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-error {
      background: #fdecea;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }

    .register-link a {
      color: #5D4037;
      font-weight: 700;
      text-decoration: none;
    }

    .register-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-box">

    <div class="logo">
      <div class="logo-icon">☕</div>
      <h1>Coffee Shop</h1>
    </div>

    <div th:if="${param.error}" class="alert alert-error">
      ⚠️ Email hoặc mật khẩu không đúng!
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
      ✅ Đăng xuất thành công!
    </div>

    <form th:action="@{/auth/login}" method="post">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <span class="icon">✉️</span>
          <input type="email"
                 name="username"
                 placeholder="admin@coffeeshop.vn"
                 required/>
        </div>
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input type="password"
                 name="password"
                 placeholder="••••••••"
                 required/>
        </div>
      </div>

      <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
    </form>

    <div class="register-link">
      Chưa có tài khoản?
      <a th:href="@{/auth/register}">Đăng ký ngay</a>
    </div>

  </div>
</div>
</body>
</html>
