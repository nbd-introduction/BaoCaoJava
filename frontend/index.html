<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Premium UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6f4e37;
            --accent: #d4a373;
            --gold: #ffb347;
            --dark-card: rgba(20, 20, 20, 0.8);
            --order-card: rgba(46, 33, 25, 0.95);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .card {
            width: 400px;
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .auth-card { background: var(--dark-card); }
        .order-card { background: var(--order-card); border: 1px solid var(--accent); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { font-family: 'Playfair Display', serif; color: var(--accent); margin-bottom: 25px; font-size: 2rem; }

        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        input:focus { outline: none; border-color: var(--accent); background: rgba(255, 255, 255, 0.15); }
        option { color: black; }

        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 13px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }

        .btn-login { background: var(--primary); color: white; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .btn-reg { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white; }
        .btn-reg:hover { background: rgba(255,255,255,0.1); }

        .btn-order { background: var(--gold); color: #2d1e14; font-weight: bold; width: 100%; margin-top: 10px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-box { background: white; color: #333; padding: 30px; border-radius: 20px; width: 300px; text-align: center; }
        .modal-box button { background: var(--primary); color: white; width: 100%; margin-top: 15px; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="auth-box" class="card auth-card">
    <h2 id="auth-title">☕ Welcome</h2>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">

    <div id="extra-fields" class="hidden">
        <input type="text" id="fullname" placeholder="Full Name">
        <input type="email" id="mail" placeholder="Email">
    </div>

    <div class="btn-group">
        <button class="btn-login" id="main-btn" onclick="handleSubmit()">Login</button>
        <button class="btn-reg" id="secondary-btn" onclick="toggleMode()">Sign Up</button>
    </div>
</div>

<div id="order-box" class="card order-card hidden">
    <h2>☕ Your Order</h2>
    <p>Hi, <b id="display-name" style="color: var(--gold)"></b>! What would you like?</p>
    <select>
        <option>☕ Espresso - 25k</option>
        <option>🥤 Latte - 30k</option>
        <option>🍫 Mocha - 35k</option>
    </select>
    <button class="btn-order" onclick="alert('Order received!')">Order Now</button>
    <p onclick="location.reload()" style="font-size: 0.8rem; cursor: pointer; margin-top: 15px; opacity: 0.7;">Logout</p>
</div>

<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <div id="modal-text"></div>
        <button onclick="closePopup()">OK</button>
    </div>
</div>

<script>
    let isRegisterMode = false;
    let loggedUser = "";
    let actionType = ""; // 'login' hoặc 'register'

    function toggleMode() {
        isRegisterMode = !isRegisterMode;
        const extra = document.getElementById('extra-fields');
        const title = document.getElementById('auth-title');
        const mainBtn = document.getElementById('main-btn');
        const secBtn = document.getElementById('secondary-btn');

        if (isRegisterMode) {
            extra.classList.remove('hidden');
            title.innerText = "☕ Join Us";
            mainBtn.innerText = "Create Account";
            secBtn.innerText = "Back to Login";
        } else {
            extra.classList.add('hidden');
            title.innerText = "☕ Welcome";
            mainBtn.innerText = "Login";
            secBtn.innerText = "Sign Up";
        }
    }

    function handleSubmit() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;

        if (!u || !p) {
            showPopup("Please fill in all fields!", "error");
            return;
        }

        if (isRegisterMode) {
            actionType = "register";
            showPopup("Account created! Please login.", "success");
            toggleMode(); // Đăng ký xong quay về giao diện Login
        } else {
            actionType = "login";
            loggedUser = u;
            showPopup("Login successful!", "success");
        }
    }

    function showPopup(msg, type) {
        document.getElementById('modal-text').innerText = msg;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closePopup() {
        document.getElementById('modal-overlay').style.display = 'none';

        // Chỉ nhảy qua trang Order nếu hành động vừa rồi là Login thành công
        if (actionType === "login") {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('order-box').classList.remove('hidden');
            document.getElementById('display-name').innerText = loggedUser;
        }
        // Reset action để tránh lỗi lặp
        actionType = "";
    }
</script>

</body>
</html>
